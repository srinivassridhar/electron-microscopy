<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="380" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Fixation timeline — chemical vs. high-pressure freezing</text><line x1="80" y1="320" x2="680" y2="320" stroke="#1a1714" stroke-width="1"/><line x1="80" y1="320" x2="80" y2="70" stroke="#1a1714" stroke-width="1"/><text x="380.0" y="355" font-size="11" text-anchor="middle" font-weight="bold">Time after fixation initiated  →  </text><text x="20" y="195.0" font-size="11" text-anchor="middle" font-weight="bold">Fraction fixed</text><line x1="80.0" y1="320" x2="80.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="80.0" y="338" font-size="10" text-anchor="middle">0</text><line x1="200.0" y1="320" x2="200.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="200.0" y="338" font-size="10" text-anchor="middle">10 s</text><line x1="320.0" y1="320" x2="320.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="320.0" y="338" font-size="10" text-anchor="middle">30 s</text><line x1="440.0" y1="320" x2="440.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="440.0" y="338" font-size="10" text-anchor="middle">1 min</text><line x1="560.0" y1="320" x2="560.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="560.0" y="338" font-size="10" text-anchor="middle">5 min</text><line x1="680.0" y1="320" x2="680.0" y2="324" stroke="#1a1714" stroke-width="0.6"/><text x="680.0" y="338" font-size="10" text-anchor="middle">30 min</text><line x1="76" y1="320" x2="80" y2="320" stroke="#1a1714" stroke-width="0.6"/><text x="72" y="324" font-size="10" text-anchor="end">0%</text><line x1="76" y1="195.0" x2="80" y2="195.0" stroke="#1a1714" stroke-width="0.6"/><text x="72" y="199.0" font-size="10" text-anchor="end">50%</text><line x1="76" y1="70.0" x2="80" y2="70.0" stroke="#1a1714" stroke-width="0.6"/><text x="72" y="74.0" font-size="10" text-anchor="end">100%</text><path d="M 80 320 Q 260.0 220.0, 500.0 107.5 L 680 82.5" fill="none" stroke="#1a1714" stroke-width="2"/><text x="410.0" y="232.5" font-size="11" font-weight="bold" fill="#1a1714">Chemical fixation</text><text x="410.0" y="265.0" font-size="10" font-style="italic" fill="#403a33">fixation front penetrates inward over seconds–minutes</text><text x="410.0" y="295.0" font-size="10" font-style="italic" fill="#403a33">interior continues dynamic changes during</text><line x1="82" y1="320" x2="82" y2="75.0" stroke="#1a1714" stroke-width="3"/><line x1="82" y1="75.0" x2="680" y2="75.0" stroke="#1a1714" stroke-width="3"/><text x="140" y="90.5" font-size="11" font-weight="bold" fill="#1a1714">← HPF: instantaneous, all-volume</text><text x="140" y="104.5" font-size="10" font-style="italic" fill="#403a33">no penetration delay; entire specimen vitrified at t = 0</text><text x="360.0" y="365" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">HPF eliminates the fixation front. For dynamic events on second-to-minute timescales, this is the only honest method.</text></svg>