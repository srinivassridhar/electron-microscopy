<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="440" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Everhart-Thornley detector — annotated cross-section</text><line x1="60" y1="360" x2="660" y2="360" stroke="#1a1714" stroke-width="1"/><text x="60" y="355" font-size="10" fill="#403a33">specimen surface</text><line x1="180" y1="50" x2="180" y2="360" stroke="#1a1714" stroke-width="1.2"/><line x1="180" y1="50" x2="180" y2="100" stroke="#1a1714" stroke-width="1.2"/><polygon points="180,100 178.3,96.4 181.7,96.4" fill="#1a1714"/><text x="190" y="60" font-size="10" font-style="italic">primary beam</text><rect x="380" y="240" width="100" height="80" fill="none" stroke="#1a1714" stroke-width="1"/><line x1="380" y1="240" x2="380" y2="320" stroke="#888076" stroke-width="0.4"/><line x1="405" y1="240" x2="405" y2="320" stroke="#888076" stroke-width="0.4"/><line x1="430" y1="240" x2="430" y2="320" stroke="#888076" stroke-width="0.4"/><line x1="455" y1="240" x2="455" y2="320" stroke="#888076" stroke-width="0.4"/><line x1="480" y1="240" x2="480" y2="320" stroke="#888076" stroke-width="0.4"/><line x1="380" y1="240" x2="480" y2="240" stroke="#888076" stroke-width="0.4"/><line x1="380" y1="267" x2="480" y2="267" stroke="#888076" stroke-width="0.4"/><line x1="380" y1="294" x2="480" y2="294" stroke="#888076" stroke-width="0.4"/><line x1="380" y1="321" x2="480" y2="321" stroke="#888076" stroke-width="0.4"/><text x="430" y="232" font-size="10" text-anchor="middle" font-weight="bold">Faraday cage  (+300 V)</text><path d="M 230 360 Q 320 320, 380 280" fill="none" stroke="#1a1714" stroke-width="1" stroke-dasharray="2,2"/><line x1="370" y1="285" x2="384" y2="282" stroke="#1a1714" stroke-width="1"/><polygon points="384,282 380.8,284.5 380.1,281.1" fill="#1a1714"/><text x="285" y="330" font-size="10" font-style="italic">SE</text><rect x="500" y="230" width="70" height="90" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="535" y="226" font-size="10" text-anchor="middle" font-weight="bold">Scintillator (+10 kV)</text><text x="535" y="280" font-size="10" text-anchor="middle" font-style="italic">phosphor</text><line x1="485" y1="280" x2="500" y2="275" stroke="#1a1714" stroke-width="1"/><polygon points="500,275 497.1,277.8 496.0,274.5" fill="#1a1714"/><path d="M 570 250 L 640 200 L 660 200 L 660 240 L 590 290 L 570 290 Z" fill="#e0d9cf" stroke="#1a1714" stroke-width="1"/><text x="620" y="175" font-size="10">light guide</text><rect x="640" y="100" width="60" height="90" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="670" y="90" font-size="10" text-anchor="middle" font-weight="bold">PMT</text><line x1="660" y1="195" x2="660" y2="190" stroke="#1a1714" stroke-width="0.5"/><rect x="640" y="50" width="60" height="30" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="670" y="70" font-size="10" text-anchor="middle">output</text><text x="360.0" y="410" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Cage voltage low (+300 V) so it does not deflect the primary beam. Scintillator high (+10 kV) so SEs hit it with enough energy to make light.</text></svg>