<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="700" height="460" fill="#f5f2ee"/><text x="350.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Specimen position relative to the objective lens</text><line x1="160" y1="50" x2="160" y2="90" stroke="#1a1714" stroke-width="1"/><polygon points="160,90 158.3,86.4 161.7,86.4" fill="#1a1714"/><text x="160" y="45" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">from gun + condensers</text><rect x="70" y="100" width="180" height="60" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="160" y="135" font-size="11" text-anchor="middle" font-weight="bold">Objective lens</text><text x="160" y="175" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">wide gap below pole piece</text><rect x="100" y="250" width="120" height="14" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="160" y="280" font-size="11" text-anchor="middle" font-weight="bold">Bulk specimen</text><text x="160" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">(working distance ≈ 5–25 mm)</text><line x1="160" y1="160" x2="160" y2="250" stroke="#888076" stroke-width="1" stroke-dasharray="2,2"/><line x1="160" y1="250" x2="127.86061951567302" y2="211.6977778440511" stroke="#888076" stroke-width="0.7"/><polygon points="127.86061951567302,211.6977778440511 131.5,213.3 128.8,215.6" fill="#888076"/><line x1="160" y1="250" x2="142.89899283371656" y2="203.01536896070456" stroke="#888076" stroke-width="0.7"/><polygon points="142.89899283371656,203.01536896070456 145.8,205.8 142.5,207.0" fill="#888076"/><line x1="160" y1="250" x2="177.10100716628344" y2="203.0153689607046" stroke="#888076" stroke-width="0.7"/><polygon points="177.10100716628344,203.0153689607046 177.5,207.0 174.2,205.8" fill="#888076"/><line x1="160" y1="250" x2="192.13938048432698" y2="211.6977778440511" stroke="#888076" stroke-width="0.7"/><polygon points="192.13938048432698,211.6977778440511 191.2,215.6 188.5,213.3" fill="#888076"/><text x="160" y="340" font-size="10" text-anchor="middle" fill="#403a33">SE/BSE escape upward — detectors above specimen</text><text x="160" y="410" font-size="14" text-anchor="middle" font-weight="bold">SEM</text><line x1="500" y1="50" x2="500" y2="90" stroke="#1a1714" stroke-width="1"/><polygon points="500,90 498.3,86.4 501.7,86.4" fill="#1a1714"/><text x="500" y="45" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">from gun + condensers</text><rect x="410" y="100" width="180" height="35" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="500" y="122" font-size="10" text-anchor="middle">Upper pole piece</text><rect x="410" y="165" width="180" height="35" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="500" y="187" font-size="10" text-anchor="middle">Lower pole piece</text><rect x="470" y="145" width="60" height="6" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="560" y="150" font-size="10">← thin specimen</text><text x="500" y="215" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">specimen INSIDE the lens</text><line x1="500" y1="95" x2="500" y2="280" stroke="#888076" stroke-width="1" stroke-dasharray="2,2"/><line x1="430" y1="240" x2="570" y2="240" stroke="#1a1714" stroke-width="0.7" stroke-dasharray="2,2"/><text x="500" y="252" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">back focal plane (objective aperture)</text><text x="500" y="295" font-size="10" text-anchor="middle" fill="#403a33">Image / diffraction projected downward</text><text x="500" y="410" font-size="14" text-anchor="middle" font-weight="bold">TEM</text><text x="350.0" y="440" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">SEM lets the specimen sit beyond the lens — easy access, big specimens, working distance to spare. TEM puts the specimen inside the lens for the smallest aberrations — at the cost of geometry.</text></svg>