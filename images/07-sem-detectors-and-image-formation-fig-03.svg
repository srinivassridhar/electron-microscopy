<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="380" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Segmented BSE — SE topography, sum (A+B), difference (A−B)</text><rect x="20" y="50" width="215" height="240" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="127.5" y="45" font-size="11" text-anchor="middle" font-weight="bold">SE</text><rect x="30" y="60" width="195" height="220" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><path d="M 50 250 Q 70 100, 110 250 Z" fill="#e0d9cf" stroke="#1a1714" stroke-width="0.6"/><path d="M 140 250 Q 170 280, 200 250 Z" fill="#403a33" stroke="#1a1714" stroke-width="0.6"/><text x="127.5" y="305" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">topography dominates</text><rect x="250" y="50" width="215" height="240" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="357.5" y="45" font-size="11" text-anchor="middle" font-weight="bold">BSE A+B (sum)</text><rect x="260" y="60" width="195" height="220" fill="#e0d9cf" stroke="#1a1714" stroke-width="1"/><rect x="270" y="80" width="80" height="180" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="360" y="80" width="80" height="180" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="357.5" y="305" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">topography cancels, composition shows</text><rect x="480" y="50" width="215" height="240" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="587.5" y="45" font-size="11" text-anchor="middle" font-weight="bold">BSE A−B (difference)</text><rect x="490" y="60" width="195" height="220" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><path d="M 510 250 Q 530 100, 570 250 Z" fill="#e0d9cf" stroke="#1a1714" stroke-width="0.6"/><path d="M 600 250 Q 630 280, 660 250 Z" fill="#403a33" stroke="#1a1714" stroke-width="0.6"/><text x="587.5" y="305" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">composition cancels, topography shows</text><text x="360.0" y="350" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">A+B cancels topographic asymmetries. A−B cancels common-mode composition. The algebra is the experiment.</text></svg>