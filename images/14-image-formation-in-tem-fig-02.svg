<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="480" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Bright-field TEM — scattering strength → image intensity</text><text x="60" y="50" font-size="11" font-weight="bold">Specimen cross-section:</text><rect x="60" y="80" width="180" height="60" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="150" y="115" font-size="11" text-anchor="middle" font-style="italic">void</text><rect x="240" y="80" width="220" height="60" fill="#e0d9cf" stroke="#1a1714" stroke-width="1"/><text x="350" y="115" font-size="11" text-anchor="middle" font-style="italic">amorphous, low-Z</text><rect x="460" y="80" width="200" height="60" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="560" y="115" font-size="11" text-anchor="middle" font-style="italic" fill="#f5f2ee">heavy / crystalline</text><text x="60" y="274" font-size="11" font-weight="bold">Back focal plane:</text><line x1="60" y1="280" x2="660" y2="280" stroke="#888076" stroke-width="0.7" stroke-dasharray="3,3"/><line x1="150" y1="145" x2="150" y2="275" stroke="#1a1714" stroke-width="2.5"/><polygon points="150,275 148.3,271.4 151.7,271.4" fill="#1a1714"/><text x="155" y="200" font-size="9" font-style="italic" fill="#403a33">lots through</text><line x1="350" y1="145" x2="350" y2="275" stroke="#1a1714" stroke-width="1.5"/><polygon points="350,275 348.3,271.4 351.7,271.4" fill="#1a1714"/><text x="355" y="200" font-size="9" font-style="italic" fill="#403a33">moderate</text><line x1="560" y1="145" x2="560" y2="275" stroke="#888076" stroke-width="0.6"/><polygon points="560,275 558.3,271.4 561.7,271.4" fill="#888076"/><line x1="560" y1="145" x2="600" y2="275" stroke="#888076" stroke-width="0.6"/><polygon points="600,275 597.3,272.1 600.6,271.0" fill="#888076"/><line x1="560" y1="145" x2="520" y2="275" stroke="#888076" stroke-width="0.6"/><polygon points="520,275 519.4,271.0 522.7,272.1" fill="#888076"/><text x="575" y="200" font-size="9" font-style="italic" fill="#403a33">few through (most scattered)</text><line x1="60" y1="280" x2="250" y2="280" stroke="#1a1714" stroke-width="2"/><line x1="450" y1="280" x2="660" y2="280" stroke="#1a1714" stroke-width="2"/><text x="660" y="268" font-size="9" text-anchor="end" font-style="italic" fill="#403a33">objective aperture</text><text x="60" y="360" font-size="11" font-weight="bold">Bright-field image:</text><rect x="60" y="370" width="180" height="60" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><rect x="240" y="370" width="220" height="60" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="460" y="370" width="200" height="60" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="150" y="405" font-size="11" text-anchor="middle" font-weight="bold">bright</text><text x="350" y="405" font-size="11" text-anchor="middle" font-weight="bold">intermediate</text><text x="560" y="405" font-size="11" text-anchor="middle" font-weight="bold" fill="#f5f2ee">dark</text><text x="360.0" y="460" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">More scattering = fewer electrons through aperture = darker pixel. Intensity is a scattering map.</text></svg>