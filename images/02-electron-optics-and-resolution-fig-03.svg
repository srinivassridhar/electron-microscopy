<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="320" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Astigmatism — through-focus signature on a spherical nanoparticle</text><rect x="-20" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><ellipse cx="90" cy="150" rx="80" ry="30" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="90" y="280" font-size="11" text-anchor="middle" font-weight="bold">Underfocus</text><text x="90" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">streak axis: horizontal</text><rect x="230" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><ellipse cx="340" cy="150" rx="50" ry="50" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="340" y="280" font-size="11" text-anchor="middle" font-weight="bold">Focus</text><text x="340" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">streak axis: minimal</text><rect x="480" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><ellipse cx="590" cy="150" rx="30" ry="80" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="590" y="280" font-size="11" text-anchor="middle" font-weight="bold">Overfocus</text><text x="590" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">streak axis: vertical</text><text x="360.0" y="130" font-size="10" text-anchor="middle" fill="#403a33">↺ 90° rotation between underfocus and overfocus</text></svg>