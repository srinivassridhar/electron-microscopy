stroke-width="1"/><text x="90" y="268" font-size="9" font-style="italic" fill="#403a33">aperture blocks ±1 → only direct passes</text><line x1="200" y1="250" x2="200" y2="330" stroke="#1a1714" stroke-width="1"/><rect x="120" y="330" width="160" height="12" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.5"/><text x="200" y="360" font-size="9" text-anchor="middle" font-style="italic">amplitude image (no fringes)</text><text x="200" y="60" font-size="11" text-anchor="middle" font-weight="bold">Conventional BF (aperture in)</text><line x1="420" y1="70" x2="660" y2="70" stroke="#1a1714" stroke-width="1"/><text x="410" y="70" font-size="9" text-anchor="end" font-style="italic" fill="#403a33">specimen</text><line x1="540" y1="40" x2="540" y2="68" stroke="#1a1714" stroke-width="1.2"/><polygon points="540,68 538.3,64.4 541.7,64.4" fill="#1a1714"/><line x1="410" y1="180" x2="670" y2="180" stroke="#1a1714" stroke-width="2"/><line x1="410" y1="250" x2="670" y2="250" stroke="#888076" stroke-width="0.6" stroke-dasharray="3,3"/><text x="675" y="246" font-size="9" font-style="italic" fill="#403a33">BFP</text><line x1="410" y1="330" x2="670" y2="330" stroke="#888076" stroke-width="0.6" stroke-dasharray="3,3"/><text x="675" y="326" font-size="9" font-style="italic" fill="#403a33">image</text><line x1="540" y1="70" x2="540" y2="180" stroke="#1a1714" stroke-width="1"/><line x1="540" y1="180" x2="540" y2="250" stroke="#1a1714" stroke-width="1"/><line x1="540" y1="70" x2="490" y2="180" stroke="#1a1714" stroke-width="1"/><line x1="490" y1="180" x2="490" y2="250" stroke="#1a1714" stroke-width="1"/><line x1="540" y1="70" x2="590" y2="180" stroke="#1a1714" stroke-width="1"/><line x1="590" y1="180" x2="590" y2="250" stroke="#1a1714" stroke-width="1"/><circle cx="540" cy="250" r="4" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><circle cx="490" cy="250" r="4" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><circle cx="590" cy="250" r="4" fill="#1a1714" stroke="#1a1714" stroke-width="1"/