<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="400" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">The opening scene — FE-SEM console with spec card</text><rect x="60" y="60" width="100" height="280" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="110" y="90" font-size="11" text-anchor="middle" font-weight="bold">Column</text><rect x="70" y="110" width="80" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="110" y="122" font-size="10" text-anchor="middle">gun</text><rect x="70" y="140" width="80" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="110" y="152" font-size="10" text-anchor="middle">C1</text><rect x="70" y="170" width="80" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="110" y="182" font-size="10" text-anchor="middle">C2</text><rect x="70" y="200" width="80" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="110" y="212" font-size="10" text-anchor="middle">obj.</text><rect x="70" y="235" width="80" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="110" y="247" font-size="10" text-anchor="middle">stage</text><rect x="280" y="80" width="380" height="220" fill="#e0d9cf" stroke="#1a1714" stroke-width="1"/><text x="470" y="70" font-size="11" text-anchor="middle" font-weight="bold">Operator monitor</text><rect x="310" y="110" width="320" height="160" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="470" y="195" font-size="11" text-anchor="middle" font-style="italic" fill="#f5f2ee">(specimen on screen)</text><rect x="310" y="270" width="320" height="18" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="320" y="283" font-size="10" fill="#f5f2ee">READY</text><text x="490" y="283" font-size="10" fill="#f5f2ee">HV: 1 kV    WD: 4.0 mm    Mag: 50,000×</text><rect x="490" y="320" width="170" height="60" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="575" y="338" font-size="10" text-anchor="middle" font-weight="bold">FE-SEM SPECIFICATION</text><text x="575" y="354" font-size="10" text-anchor="middle">Resolution at 30 kV: 1.0 nm</text><text x="575" y="368" font-size="10" text-anchor="middle">Resolution at 1 kV: 1.6 nm</text><line x1="450" y1="310" x2="500" y2="325" stroke="#403a33" stroke-width="0.8"/><polygon points="500,325 496.1,325.6 497.1,322.3" fill="#403a33"/><text x="420" y="305" font-size="10" font-style="italic" fill="#403a33">laminated spec card</text><text x="360.0" y="395" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">The number on the card is the output of decisions, not a property of the metal.</text></svg>