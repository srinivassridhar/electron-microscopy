<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="440" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Three TEM objective architectures — gap vs. resolution trade-off</text><rect x="50" y="70" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="50" y="180" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="90" y="147.0" width="60" height="6" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="120" y="137.0" font-size="9" text-anchor="middle" font-style="italic">specimen</text><line x1="120" y1="50" x2="120" y2="320" stroke="#888076" stroke-width="0.6" stroke-dasharray="2,2"/><text x="120" y="60" font-size="11" text-anchor="middle" font-weight="bold">Split polepiece</text><text x="50" y="350" font-size="10">Gap: wide (≥6 mm)</text><text x="50" y="364" font-size="10">C_s: ~3 mm</text><text x="50" y="378" font-size="10">Tilt: high (±70°)</text><text x="50" y="392" font-size="10">Holder: flexible (EDS, cooling)</text><text x="50" y="406" font-size="10">Resolution: good (~2 Å)</text><rect x="290" y="70" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="290" y="136" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="330" y="125.0" width="60" height="6" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="360" y="115.0" font-size="9" text-anchor="middle" font-style="italic">specimen</text><line x1="360" y1="50" x2="360" y2="320" stroke="#888076" stroke-width="0.6" stroke-dasharray="2,2"/><text x="360" y="60" font-size="11" text-anchor="middle" font-weight="bold">Immersion</text><text x="290" y="350" font-size="10">Gap: narrow (~2 mm)</text><text x="290" y="364" font-size="10">C_s: ~0.5 mm</text><text x="290" y="378" font-size="10">Tilt: limited (±30°)</text><text x="290" y="392" font-size="10">Holder: constrained</text><text x="290" y="406" font-size="10">Resolution: best (sub-Å)</text><rect x="530" y="70" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="530" y="250" width="140" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><path d="M 670 120 Q 760 200, 670 250" fill="none" stroke="#888076" stroke-width="0.5" stroke-dasharray="2,2"/><rect x="570" y="200" width="60" height="6" fill="#403a33" stroke="#1a1714" stroke-width="1"/><text x="600" y="190" font-size="9" text-anchor="middle" font-style="italic">specimen</text><line x1="600" y1="50" x2="600" y2="320" stroke="#888076" stroke-width="0.6" stroke-dasharray="2,2"/><text x="600" y="60" font-size="11" text-anchor="middle" font-weight="bold">Snorkel</text><text x="530" y="350" font-size="10">Gap: asymmetric</text><text x="530" y="364" font-size="10">C_s: ~1 mm</text><text x="530" y="378" font-size="10">Tilt: moderate</text><text x="530" y="392" font-size="10">Holder: good access</text><text x="530" y="406" font-size="10">Resolution: intermediate</text><text x="360.0" y="425" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Three points on one trade-off: narrow gap → small C_s → high resolution → less holder room.</text></svg>