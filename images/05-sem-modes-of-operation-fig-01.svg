<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="380" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Interaction volume vs. accelerating voltage</text><line x1="5" y1="80" x2="265" y2="80" stroke="#1a1714" stroke-width="1.2"/><line x1="135" y1="35" x2="135" y2="78" stroke="#1a1714" stroke-width="1.2"/><polygon points="135,78 133.3,74.4 136.7,74.4" fill="#1a1714"/><text x="135" y="30" font-size="11" text-anchor="middle" font-weight="bold">1 kV</text><path d="M 110.5 80 Q 100 94.0, 114.0 115.0 Q 135 132.5, 156.0 115.0 Q 170 94.0, 159.5 80 Z" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.2"/><circle cx="215" cy="76" r="3" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="221" y="76" font-size="9" fill="#403a33">5 nm feature</text><text x="135" y="154.5" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">≈ 30 nm</text><line x1="230" y1="80" x2="490" y2="80" stroke="#1a1714" stroke-width="1.2"/><line x1="360" y1="35" x2="360" y2="78" stroke="#1a1714" stroke-width="1.2"/><polygon points="360,78 358.3,74.4 361.7,74.4" fill="#1a1714"/><text x="360" y="30" font-size="11" text-anchor="middle" font-weight="bold">5 kV</text><path d="M 293.5 80 Q 265 118.0, 303.0 175.0 Q 360 222.5, 417.0 175.0 Q 455 118.0, 426.5 80 Z" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.2"/><circle cx="440" cy="76" r="3" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="446" y="76" font-size="9" fill="#403a33">5 nm feature</text><text x="360" y="244.5" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">≈ 500 nm</text><line x1="460" y1="80" x2="720" y2="80" stroke="#1a1714" stroke-width="1.2"/><line x1="590" y1="35" x2="590" y2="78" stroke="#1a1714" stroke-width="1.2"/><polygon points="590,78 588.3,74.4 591.7,74.4" fill="#1a1714"/><text x="590" y="30" font-size="11" text-anchor="middle" font-weight="bold">30 kV</text><path d="M 485.0 80 Q 440 140.0, 500.0 230.0 Q 590 305.0, 680.0 230.0 Q 740 140.0, 695.0 80 Z" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.2"/><circle cx="670" cy="76" r="3" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="676" y="76" font-size="9" fill="#403a33">5 nm feature</text><text x="590" y="327.0" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">≈ 5 μm</text><text x="360.0" y="350" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">At 30 kV the volume dwarfs the 5 nm feature you wanted to image. At 1–5 kV, they're comparable.</text><text x="360.0" y="366" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">All three teardrops drawn at the same physical scale.</text></svg>