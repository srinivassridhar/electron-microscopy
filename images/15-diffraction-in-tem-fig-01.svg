<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="360" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Polycrystalline TiO₂ — bright-field image (left) and SAED ring pattern (right)</text><rect x="20" y="50" width="320" height="250" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="180.0" y="45" font-size="10" text-anchor="middle" font-weight="bold">BF, 50,000×</text><rect x="30" y="60" width="300" height="230" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="180.0" y="175" font-size="11" text-anchor="middle" font-style="italic" fill="#403a33">(featureless gray field)</text><line x1="50" y1="280" x2="110" y2="280" stroke="#1a1714" stroke-width="2"/><text x="80" y="295" font-size="10" text-anchor="middle">20 nm</text><rect x="360" y="50" width="320" height="250" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="520.0" y="45" font-size="10" text-anchor="middle" font-weight="bold">SAED, same region</text><rect x="370" y="60" width="300" height="230" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><circle cx="520.0" cy="175" r="30" fill="none" stroke="#f5f2ee" stroke-width="1"/><text x="553.0" y="150" font-size="9" fill="#f5f2ee">(101)  d = 0.351 nm</text><circle cx="520.0" cy="175" r="52" fill="none" stroke="#f5f2ee" stroke-width="1"/><text x="575.0" y="128" font-size="9" fill="#f5f2ee">(004)  d = 0.238 nm</text><circle cx="520.0" cy="175" r="75" fill="none" stroke="#f5f2ee" stroke-width="1"/><text x="598.0" y="105" font-size="9" fill="#f5f2ee">(200)  d = 0.189 nm</text><circle cx="520.0" cy="175" r="95" fill="none" stroke="#f5f2ee" stroke-width="1"/><text x="618.0" y="85" font-size="9" fill="#f5f2ee">(105)  d = 0.170 nm</text><circle cx="520.0" cy="175" r="4" fill="#f5f2ee" stroke="#f5f2ee" stroke-width="1"/><text x="528.0" y="179" font-size="9" fill="#f5f2ee">(000)</text><line x1="390" y1="280" x2="450" y2="280" stroke="#f5f2ee" stroke-width="2"/><text x="420" y="295" font-size="10" text-anchor="middle" fill="#f5f2ee">5 nm⁻¹</text><text x="360.0" y="345" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">The same area, two outputs of one lens. Featureless gray on the left becomes a ring fingerprint on the right.</text></svg>