<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="420" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Projection ambiguity — three different 3D objects, the same 2D projection</text><rect x="80" y="60" width="140" height="140" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="150" y="50" font-size="11" text-anchor="middle" font-weight="bold">Sphere (hollow shell)</text><rect x="290" y="60" width="140" height="140" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="360" y="50" font-size="11" text-anchor="middle" font-weight="bold">Thick disk</text><rect x="500" y="60" width="140" height="140" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="570" y="50" font-size="11" text-anchor="middle" font-weight="bold">Torus</text><circle cx="150" cy="130" r="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><circle cx="150" cy="130" r="35" fill="#f5f2ee" stroke="#888076" stroke-width="0.6"/><text x="150" y="220" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">(hollow, ring outline only)</text><ellipse cx="360" cy="130" rx="50" ry="18" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><line x1="310" y1="130" x2="310" y2="165" stroke="#1a1714" stroke-width="1"/><line x1="410" y1="130" x2="410" y2="165" stroke="#1a1714" stroke-width="1"/><path d="M 310 165 Q 360 178, 410 165" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="360" y="220" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">(solid disk)</text><ellipse cx="570" cy="130" rx="50" ry="25" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><ellipse cx="570" cy="130" rx="25" ry="12" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="570" y="220" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">(donut)</text><text x="360.0" y="250" font-size="11" text-anchor="middle" font-weight="bold">Project along the vertical axis (TEM beam):</text><rect x="80" y="270" width="140" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><circle cx="150" cy="320" r="38" fill="none" stroke="#1a1714" stroke-width="4"/><circle cx="150" cy="320" r="6" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><line x1="150" y1="230" x2="150" y2="268" stroke="#403a33" stroke-width="1"/><polygon points="150,268 148.3,264.4 151.7,264.4" fill="#403a33"/><rect x="290" y="270" width="140" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><circle cx="360" cy="320" r="38" fill="none" stroke="#1a1714" stroke-width="4"/><circle cx="360" cy="320" r="6" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><line x1="360" y1="230" x2="360" y2="268" stroke="#403a33" stroke-width="1"/><polygon points="360,268 358.3,264.4 361.7,264.4" fill="#403a33"/><rect x="500" y="270" width="140" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><circle cx="570" cy="320" r="38" fill="none" stroke="#1a1714" stroke-width="4"/><circle cx="570" cy="320" r="6" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><line x1="570" y1="230" x2="570" y2="268" stroke="#403a33" stroke-width="1"/><polygon points="570,268 568.3,264.4 571.7,264.4" fill="#403a33"/><text x="360.0" y="395" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">All three objects produce identical projections along one axis. Tomography distinguishes them by acquiring projections from many angles.</text></svg>