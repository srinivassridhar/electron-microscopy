<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="360" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Depth of field — optical (thin focal plane) vs. SEM (full depth)</text><rect x="20" y="40" width="320" height="270" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="180.0" y="35" font-size="10" text-anchor="middle" font-weight="bold">Optical, NA ≈ 0.5</text><ellipse cx="120.0" cy="100" rx="50" ry="18" fill="#e0d9cf" stroke="#c9c2b8" stroke-width="1"/><text x="180.0" y="100" font-size="10" font-style="italic" fill="#c9c2b8">(blur)</text><ellipse cx="180.0" cy="175" rx="70" ry="22" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.5"/><text x="260.0" y="175" font-size="10" font-weight="bold" font-style="italic">← in focus</text><ellipse cx="230.0" cy="250" rx="60" ry="18" fill="#e0d9cf" stroke="#c9c2b8" stroke-width="1"/><text x="290.0" y="250" font-size="10" font-style="italic" fill="#c9c2b8">(blur)</text><text x="180.0" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">depth of field ≈ 1 μm</text><rect x="360" y="40" width="320" height="270" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="520.0" y="35" font-size="10" text-anchor="middle" font-weight="bold">SEM, α ≈ 5 mrad</text><ellipse cx="460.0" cy="100" rx="50" ry="18" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.5"/><ellipse cx="520.0" cy="175" rx="70" ry="22" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.5"/><ellipse cx="570.0" cy="250" rx="60" ry="18" fill="#c9c2b8" stroke="#1a1714" stroke-width="1.5"/><text x="520.0" y="295" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">depth of field ≈ 1 mm — 1000× more</text><text x="360.0" y="345" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Small aperture angle → big depth of field. The SEM's geometric advantage at every magnification.</text></svg>