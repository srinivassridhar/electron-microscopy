<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="380" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Polycrystalline thin foil — diffraction contrast tested by tilt</text><rect x="20" y="50" width="320" height="250" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="180.0" y="45" font-size="10" text-anchor="middle" font-weight="bold">BF, untilted</text><rect x="50" y="70" width="100" height="80" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.7"/><text x="100.0" y="114.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1714">bright</text><rect x="160" y="70" width="100" height="80" fill="#1a1714" stroke="#1a1714" stroke-width="0.7"/><text x="210.0" y="114.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#f5f2ee">dark</text><rect x="270" y="70" width="60" height="80" fill="#403a33" stroke="#1a1714" stroke-width="0.7"/><rect x="50" y="160" width="80" height="130" fill="#888076" stroke="#1a1714" stroke-width="0.7"/><rect x="140" y="160" width="100" height="130" fill="#403a33" stroke="#1a1714" stroke-width="0.7"/><rect x="250" y="160" width="80" height="130" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.7"/><text x="180.0" y="320" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">grain mosaic from orientation variation</text><rect x="360" y="50" width="320" height="250" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="520.0" y="45" font-size="10" text-anchor="middle" font-weight="bold">BF, +5° tilt</text><rect x="390" y="70" width="100" height="80" fill="#1a1714" stroke="#1a1714" stroke-width="0.7"/><text x="440.0" y="114.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#f5f2ee">now dark</text><rect x="500" y="70" width="100" height="80" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.7"/><text x="550.0" y="114.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#1a1714">now bright</text><rect x="610" y="70" width="60" height="80" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.7"/><rect x="390" y="160" width="80" height="130" fill="#403a33" stroke="#1a1714" stroke-width="0.7"/><rect x="480" y="160" width="100" height="130" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.7"/><rect x="590" y="160" width="80" height="130" fill="#888076" stroke="#1a1714" stroke-width="0.7"/><path d="M 390 100 Q 520.0 200, 650 250" fill="none" stroke="#1a1714" stroke-width="4"/><path d="M 390 100 Q 520.0 200, 650 250" fill="none" stroke="#403a33" stroke-width="2"/><text x="600" y="130" font-size="10" font-weight="bold" font-style="italic">← bend contour</text><text x="520.0" y="320" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">contrast reverses; bend contour now visible</text><text x="360.0" y="360" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Diffraction contrast is orientation-dependent. If a feature changes on tilt, it's diffraction — not topography or composition.</text></svg>