<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="320" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Fresnel fringes — through-focus at a hole edge in carbon film</text><rect x="-20" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><line x1="90" y1="60" x2="90" y2="240" stroke="#1a1714" stroke-width="1.5"/><rect x="-18" y="52" width="108" height="196" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><rect x="91" y="52" width="108" height="196" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><line x1="94" y1="60" x2="94" y2="240" stroke="#f5f2ee" stroke-width="2.5"/><line x1="94" y1="60" x2="94" y2="240" stroke="#1a1714" stroke-width="0.6" stroke-dasharray="2,3"/><text x="102" y="150" font-size="9" fill="#403a33">↑ bright fringe inside (right of edge)</text><text x="90" y="280" font-size="11" text-anchor="middle" font-weight="bold">Underfocus</text><rect x="230" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><line x1="340" y1="60" x2="340" y2="240" stroke="#1a1714" stroke-width="1.5"/><rect x="232" y="52" width="108" height="196" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><rect x="341" y="52" width="108" height="196" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="352" y="150" font-size="10" font-style="italic" fill="#403a33">fringes minimized</text><text x="340" y="280" font-size="11" text-anchor="middle" font-weight="bold">Focus</text><rect x="480" y="50" width="220" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><line x1="590" y1="60" x2="590" y2="240" stroke="#1a1714" stroke-width="1.5"/><rect x="482" y="52" width="108" height="196" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><rect x="591" y="52" width="108" height="196" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><line x1="586" y1="60" x2="586" y2="240" stroke="#f5f2ee" stroke-width="2.5"/><line x1="586" y1="60" x2="586" y2="240" stroke="#1a1714" stroke-width="0.6" stroke-dasharray="2,3"/><text x="490" y="150" font-size="9" fill="#403a33">bright fringe outside (left) ↑</text><text x="590" y="280" font-size="11" text-anchor="middle" font-weight="bold">Overfocus</text><text x="360.0" y="305" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Diagnostic: which side of the edge does the fringe sit on?</text></svg>