<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="480" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">BF TEM — three contrast mechanisms in one stained biological section</text><rect x="40" y="50" width="430" height="380" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="255" y="45" font-size="11" text-anchor="middle" font-weight="bold">Untilted</text><path d="M 90 100 Q 60 250, 120 380 Q 250 400, 380 380 Q 440 250, 410 100 Q 250 80, 90 100 Z" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><ellipse cx="180" cy="200" rx="35" ry="22" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="220" y="200" font-size="11" font-weight="bold" fill="#1a1714">1</text><circle cx="330" cy="180" r="20" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><text x="360" y="180" font-size="11" font-weight="bold" fill="#1a1714">2</text><line x1="160" y1="320" x2="240" y2="320" stroke="#1a1714" stroke-width="0.7"/><line x1="160" y1="326" x2="240" y2="326" stroke="#1a1714" stroke-width="0.7"/><line x1="160" y1="332" x2="240" y2="332" stroke="#1a1714" stroke-width="0.7"/><line x1="160" y1="338" x2="240" y2="338" stroke="#1a1714" stroke-width="0.7"/><line x1="160" y1="344" x2="240" y2="344" stroke="#1a1714" stroke-width="0.7"/><text x="170" y="360" font-size="11" font-weight="bold" fill="#1a1714">3</text><text x="45" y="135" font-size="10" font-weight="bold">(1) dark mitochondria</text><text x="45" y="150" font-size="10" font-style="italic" fill="#403a33">    mass-thickness: osmium-stained membranes (high Z)</text><text x="45" y="415" font-size="10" font-style="italic" fill="#403a33">(2) bright lipid droplet — mass-thickness: low Z, thin</text><text x="245" y="415" font-size="10" font-style="italic" fill="#403a33">(3) thin dark lines — diffraction contrast: ferritin nanocrystal at Bragg condition</text><rect x="495" y="130" width="195" height="200" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="593" y="125" font-size="11" text-anchor="middle" font-weight="bold">Same field, +5° tilt</text><path d="M 510 145 Q 500 230, 525 320 Q 593 330, 668 320 Q 690 230, 680 145 Q 593 137, 510 145 Z" fill="#c9c2b8" stroke="#1a1714" stroke-width="0.8"/><ellipse cx="560" cy="220" rx="22" ry="14" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><circle cx="625" cy="200" r="13" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.5"/><line x1="540" y1="270" x2="600" y2="270" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="275" x2="600" y2="275" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="280" x2="600" y2="280" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="285" x2="600" y2="285" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="290" x2="600" y2="290" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="295" x2="600" y2="295" stroke="#1a1714" stroke-width="1.3"/><line x1="540" y1="300" x2="600" y2="300" stroke="#1a1714" stroke-width="1.3"/><text x="593" y="350" font-size="9" text-anchor="middle" font-weight="bold" font-style="italic">diffraction lines → prominent</text><text x="593" y="365" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">mass-thickness contrast unchanged</text><text x="360.0" y="460" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Tilt is the test: contrast that changes with orientation is diffraction; contrast that doesn't is mass-thickness.</text></svg>