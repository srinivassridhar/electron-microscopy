<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="700" height="400" fill="#f5f2ee"/><text x="350.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">Magnetic lens cross-section — three trajectories</text><line x1="40" y1="200" x2="660" y2="200" stroke="#888076" stroke-width="0.7" stroke-dasharray="3,3"/><text x="660" y="194" font-size="10" text-anchor="end" font-style="italic" fill="#403a33">z (optical axis)</text><rect x="180" y="110" width="220" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><rect x="180" y="240" width="220" height="50" fill="#c9c2b8" stroke="#1a1714" stroke-width="1"/><text x="290" y="100" font-size="10" text-anchor="middle">Iron yoke (pole pieces)</text><circle cx="210" cy="135" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="210" cy="265" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="230" cy="135" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="230" cy="265" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="370" cy="135" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="370" cy="265" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="390" cy="135" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><circle cx="390" cy="265" r="5" fill="#f5f2ee" stroke="#1a1714" stroke-width="0.7"/><text x="220" y="105" font-size="9" fill="#403a33">coil</text><line x1="290" y1="160" x2="290" y2="240" stroke="#888076" stroke-width="0.6" stroke-dasharray="2,2"/><text x="290" y="175" font-size="9" text-anchor="middle" font-style="italic" fill="#403a33">gap</text><path d="M 40 197 Q 290 198, 540 200" fill="none" stroke="#1a1714" stroke-width="1.2"/><text x="45" y="192" font-size="10" fill="#1a1714">paraxial</text><path d="M 40 170 Q 290 180, 510 200" fill="none" stroke="#1a1714" stroke-width="1.2"/><text x="45" y="165" font-size="10" fill="#403a33">moderate angle</text><path d="M 40 140 Q 290 155, 470 200" fill="none" stroke="#1a1714" stroke-width="1.2"/><text x="45" y="135" font-size="10" fill="#403a33">steep angle</text><path d="M 40 203 Q 290 202, 540 200" fill="none" stroke="#888076" stroke-width="0.8"/><path d="M 40 230 Q 290 220, 510 200" fill="none" stroke="#888076" stroke-width="0.8"/><path d="M 40 260 Q 290 245, 470 200" fill="none" stroke="#888076" stroke-width="0.8"/><line x1="540" y1="194" x2="540" y2="206" stroke="#1a1714" stroke-width="1.2"/><text x="540" y="222" font-size="10" text-anchor="middle" font-style="italic">f₀</text><line x1="510" y1="194" x2="510" y2="206" stroke="#1a1714" stroke-width="1.2"/><text x="510" y="222" font-size="10" text-anchor="middle" font-style="italic">f_m</text><line x1="470" y1="194" x2="470" y2="206" stroke="#1a1714" stroke-width="1.2"/><text x="470" y="222" font-size="10" text-anchor="middle" font-style="italic">f_s</text><text x="350.0" y="360" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">Steeper trajectories cross the axis closer to the lens — the geometric origin of spherical aberration.</text></svg>