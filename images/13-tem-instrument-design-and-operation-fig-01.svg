<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" width="540" height="720" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="540" height="720" fill="#f5f2ee"/><text x="270.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">TEM column — annotated</text><rect x="200.0" y="50" width="80" height="620" fill="#e0d9cf" stroke="#1a1714" stroke-width="1"/><rect x="208.0" y="60" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="73" font-size="10">Electron gun  (200 kV)</text><rect x="208.0" y="95" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="108" font-size="10">Anode / accelerator</text><rect x="208.0" y="135" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="148" font-size="10">Condenser 1 (C1)</text><rect x="208.0" y="175" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="188" font-size="10">Condenser 2 (C2)</text><rect x="208.0" y="210" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="223" font-size="10">Condenser aperture</text><rect x="208.0" y="250" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="263" font-size="10">Airlock / specimen entry</text><rect x="208.0" y="290" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="303" font-size="10">Objective — upper polepiece</text><rect x="208.0" y="340" width="64" height="18" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="353" font-size="10" font-weight="bold" fill="#1a1714">Specimen stage  ←</text><rect x="208.0" y="390" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="403" font-size="10">Objective — lower polepiece</text><rect x="208.0" y="425" width="64" height="18" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="438" font-size="10" font-weight="bold" fill="#1a1714">Back focal plane (objective aperture)</text><rect x="208.0" y="470" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="483" font-size="10">SAED aperture</text><rect x="208.0" y="510" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="523" font-size="10">Intermediate lens</text><rect x="208.0" y="550" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="563" font-size="10">Projector 1</text><rect x="208.0" y="585" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="598" font-size="10">Projector 2</text><rect x="208.0" y="625" width="64" height="18" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="290.0" y="638" font-size="10">Phosphor screen / camera</text><line x1="240" y1="50" x2="240" y2="660" stroke="#888076" stroke-width="0.5" stroke-dasharray="2,2"/><text x="40" y="55" font-size="11" font-weight="bold">200 kV</text><line x1="80" y1="60" x2="195" y2="65" stroke="#1a1714" stroke-width="1"/><polygon points="195,65 191.3,66.6 191.5,63.1" fill="#1a1714"/><rect x="380" y="410" width="130" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/><text x="445" y="425" font-size="10" text-anchor="middle" font-weight="bold">Two outputs of one lens</text><text x="390" y="445" font-size="9">BFP → diffraction pattern</text><text x="390" y="460" font-size="9">Image plane → image</text><text x="390" y="478" font-size="9" font-style="italic" fill="#403a33">Selected by intermediate</text><text x="390" y="491" font-size="9" font-style="italic" fill="#403a33">lens strength.</text><text x="270.0" y="700" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">The projector lenses select which plane reaches the camera.</text></svg>