<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Georgia, serif" font-size="11" fill="#1a1714"><rect x="0" y="0" width="720" height="460" fill="#f5f2ee"/><text x="360.0" y="22" font-size="11" text-anchor="middle" font-weight="bold">CO₂ phase diagram — critical-point drying path</text><line x1="90" y1="380" x2="630" y2="380" stroke="#1a1714" stroke-width="1"/><line x1="90" y1="380" x2="90" y2="60" stroke="#1a1714" stroke-width="1"/><text x="30" y="220.0" font-size="11" text-anchor="middle" font-weight="bold">Pressure</text><text x="360.0" y="410" font-size="11" text-anchor="middle" font-weight="bold">Temperature</text><line x1="170" y1="280" x2="200" y2="80" stroke="#1a1714" stroke-width="1"/><path d="M 170 280 Q 130 350, 110 380" fill="none" stroke="#1a1714" stroke-width="1"/><path d="M 170 280 Q 270 200, 470 160" fill="none" stroke="#1a1714" stroke-width="1"/><text x="170" y="140" font-size="12" font-weight="bold">Solid</text><text x="290" y="130" font-size="12" font-weight="bold">Liquid</text><text x="290" y="330" font-size="12" font-weight="bold">Gas</text><text x="530" y="140" font-size="12" font-weight="bold">Supercritical</text><circle cx="470" cy="160" r="4" fill="#1a1714" stroke="#1a1714" stroke-width="1"/><text x="480" y="156" font-size="10">Critical point  (31°C, 73 bar)</text><path d="M 290 250 L 290 140 L 530 140 L 570 330" fill="none" stroke="#1a1714" stroke-width="2"/><line x1="290" y1="140" x2="291" y2="139" stroke="#1a1714" stroke-width="2"/><polygon points="291,139 289.7,142.8 287.2,140.3" fill="#1a1714"/><line x1="570" y1="330" x2="571" y2="331" stroke="#1a1714" stroke-width="2"/><polygon points="571,331 567.2,329.7 569.7,327.2" fill="#1a1714"/><text x="410" y="125" font-size="11" font-weight="bold" fill="#1a1714">CPD path — avoids the boundary</text><path d="M 290 250 L 370 280 L 370 330" fill="none" stroke="#403a33" stroke-width="2" stroke-dasharray="5,3"/><line x1="370" y1="330" x2="371" y2="331" stroke="#403a33" stroke-width="2"/><polygon points="371,331 367.2,329.7 369.7,327.2" fill="#403a33"/><text x="320" y="300" font-size="10" font-style="italic" fill="#403a33">Direct evaporation</text><text x="320" y="315" font-size="10" font-style="italic" fill="#403a33">(crosses LV boundary —</text><text x="320" y="330" font-size="10" font-style="italic" fill="#403a33">surface tension shreds specimen)</text><text x="360.0" y="440" font-size="10" text-anchor="middle" font-style="italic" fill="#403a33">The supercritical detour eliminates the liquid-vapor interface — and the surface tension that comes with it.</text></svg>